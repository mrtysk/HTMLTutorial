<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javascript-DOM</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <button id="changeButton">表示切り替え</button>
    <h1>自己紹介</h1>
    <h2 class="hello">こんにちは</h2>
    <p id="name">私の名前は太郎です。</p>
    <h3 class="hello">初めまして</h3>
    <p id="hobby">私の趣味は</p>
    <ul>
      <li>野球</li>
      <li>サッカー</li>
      <li>バスケ</li>
    </ul>

    <p>現在の数は<span id="counter">0</span></p>
    <button id="increment">増やす (+1)</button>
    <button id="decrement">減らす (-1)</button>
    <button id="reset">リセット</button>

    <script src="../js/script.js"></script>
  </body>
</html>
