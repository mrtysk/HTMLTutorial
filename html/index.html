<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>javascript-task</title>
  </head>
  <body>
    <div>
      <h1>カウントダウンタイマー</h1>
      <input id="inputCount" type="number" value="" placeholder="秒数入力欄" />
      <button id="startButton">開始</button>
      <p id="displayCount">カウントダウンを表示</p>
    </div>

    <div>
      <button id="asynchronousButton">非同期処理</button>
    </div>

    <div>
      <button id="parallelButton">並行処理を開始する！</button>
    </div>
    <script src="../js/script.js"></script>
  </body>
</html>
