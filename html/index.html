<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS課題1</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <!-- 1.赤文字で見出し1「ここが見出しです」を設定する。 -->
    <h1>ここが見出しです</h1>
    <!-- 2.赤枠、背景色がグレーの場所に以下のものを配置する。 -->
    <!-- ・黒文字、細文字で見出し2「見出し２です」を設定する。 -->
    <!-- ・黒文字で以下の文章を設定する。 あああああ いいいいい ううううう -->
    <div class="class1">
      <h2>見出し2です</h2>
      <p>
        あああああ<br />
        いいいいい<br />
        ううううう<br />
      </p>
    </div>
    <!-- 3.以下のような箇条書きを作成する。 -->
    <ul>
      <li>１つ目(黒文字)</li>
      <li class="blue">２つ目(青文字)</li>
      <li class="bold">３つ目(黒文字、太文字)</li>
      <li class="bold purple">４つ目(紫文字、太文字)</li>
      <li>５つ目(黒文字)</li>
    </ul>
  </body>
</html>
