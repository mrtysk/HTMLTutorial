<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>とあるブログのページ</title>
  </head>

  <body>
    <header>
      <h1>ここはヘッダーです。</h1>
    </header>

    <main>
        <article>
      <h2>最近あった嬉しい出来事</h2>
     
        <section>
        <h1>①旧友との再開</h1>
        <p>最寄り駅で久しぶりに学生時代の友達と偶然に会い、昔話で盛り上がった。</p>
      </section>

        <section>
        <h1>②映画を見た</h1>
        <p>長い制作期間の甲斐もあり素晴らしい出来だった。</p>

        <section>
        <h1>③美味しいケーキを食べた</h1>
        <p>休日に前から気になってたカフェのケーキを食べました。</p>
        <!-- 画像挿入 -->
        <img src="cafecake.jpg" alt="ケーキの写真">
        </section>

        <!-- 折りたたみコンテンツ -->
        <details>
          <summary>広島県の宮島に生息する鹿は</summary>
          <p>奈良県から連れてこられたらしい</p>
        </details>
        </section>

        <section>
        <h2>コメント入力欄</h2>
        <form>
          <textarea rows="4" cols="50">ここにコメントを入力</textarea><br>
          <button type="submit">送信</button>
        </form>
        </section>

        <!-- 一番上に戻るリンク -->
        <nav>
	        <p><a href="#">一番上に戻る</a></p>
        </nav>

        </article>
    </main>

    <aside>
      <h2>サイドバー</h2>
      <p>関連記事とか</p>
    </aside>
        
    <footer>
      <p>ここはフッダーです。</p>
    </footer>

  </body>
</html>
<!-- HTML、いざ手を動かしてみると難しく感じました。 -->
