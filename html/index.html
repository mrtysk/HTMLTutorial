<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>とあるブログのページ</title>
  </head>
  <body>
    <header>
      <p>ここはヘッダーです。</p>
    </header>
    <main>
        <article>
        <h1>最近あった嬉しい出来事</h1> 
        <section>
        <h2>①旧友との再開</h2>
            <p>最寄り駅で久しぶりに学生時代の友達と偶然に会い、昔話で盛り上がった。</p>
        </section>
        <section>
        <h2>②映画を見た</h2>
            <p>長い制作期間の甲斐もあり素晴らしい出来だった。</p>
        </section>
        <section>
        <h2>③美味しいケーキを食べた</h2>
            <p>休日に前から気になってたカフェのケーキを食べに行った。</p>
<!-- 画像挿入 -->
        <img src="cafecake.jpg" alt="ケーキの写真"><br><br>
        </section>
<!-- 折りたたみコンテンツ -->
        <details>
          <summary>豆知識</summary>
          <p>広島県の宮島に生息する鹿は</p>
          <p>奈良県から連れてこられたらしい</p>  
        </details>
        </section>

        <section>
        <h2>コメント入力欄</h2>
        <form>
          <textarea rows="4" cols="50">ここにコメントを入力</textarea><br>
          <button type="submit">送信</button>
        </form>
        </section>
<!-- 一番上に戻るリンク -->
        <nav>
	        <p><a href="#">一番上に戻る</a></p>
        </nav>
        </article>
    </main>
    <footer>
      <p>ここはフッダーです。</p>
    </footer>
  </body>
</html>
<!-- HTML、簡単だと思っていた時代が僕にもありました。 -->
