<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>とあるブログのページ</title>
  </head>


  <body>
    <header>
      <h1>ここはヘッダーです。</h1>
    </header>


    <main>
        <article>
      <h2>最近あった嬉しい出来事</h2>
     
        <section>
        <h1>①友達と再会できた</h1>
        <p>久しぶりに学生時代の友達と会って、昔話で盛り上がれたのが嬉しかったです。</p>
      </section>

      <section>
        <h1>②美味しいご飯を食べた</h1>
        <p>休日に外食して、前から気になってたお店のランチを食べました。</p>
        <!-- 画像 -->
        <img src="sample.jpg" alt="美味しいご飯の写真">
      </section>

      <section>
        <h1>③目標を達成できた</h1>
        <p>コツコツ続けていたことが一段落して、達成感がありました。</p>

        <!-- 折りたたみコンテンツ -->
        <details>
          <summary>詳しく見る</summary>
          <p>
            最初は大変でしたが、最後までやりきることができて
            自信につながりました。
          </p>
        </details>
        </section>


        <section>
        <h2>コメント入力欄</h2>
        <form>
          <textarea rows="4" cols="50">ここにコメントを入力</textarea><br>
          <button type="submit">送信</button>
        </form>
        </section>



<nav>
	<p><a href="#">一番上に戻る</a></p>
</nav>


        </article>
    </main>




    <aside>
      <h2>サイドバー</h2>
      <p>関連記事とか</p>
    </aside>
    
    
    
    <footer>
      <p>ここはフッダーです。</p>
    </footer>
  </body>
</html>


<!-- HTML、意外にできること多い。 -->
